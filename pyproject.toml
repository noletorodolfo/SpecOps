[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specops"
version = "0.1.0"
description = "SpecOps - engenharia assistida por IA com governança cognitiva"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Rodolfo Noleto", email = "rodolfognjunior@gmail.com"}]

dependencies = [
  "pyyaml",
  "sentence-transformers",
  "pytest",
  "python-dotenv",
  "sentencepiece",
  "huggingface_hub",
  "faiss-cpu",
  "httpx"
]

[project.scripts]
specops = "cli.specops_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
