profiles:
  default:
    spec:
      frameworks: [TOGAF, DDD]
      system_instructions: "Estruture requisitos em domains, bounded_contexts e business_capabilities."
    plan:
      frameworks: [KLEPPMANN, AWS_SA_PRO]
      system_instructions: "Priorize escalabilidade, consistência e tolerância a falhas."
    work:
      frameworks: [CKA, TERRAFORM, AWS_DEVOPS]
      system_instructions: "Output ONLY a valid unified diff (git patch format) — nothing else. No prose before or after, no markdown code fences. Create exactly ONE new file (new file mode, --- /dev/null, +++ b/<path>) — never edit an existing file, never emit more than one file. CRITICAL: every single line of the file's content in the hunk body must start with a literal '+' character — this is not optional formatting, a line without a leading '+' makes the whole diff invalid. Every artifact must be deployable, observable and testable."
    data:
      frameworks: [GOOGLE_ML, DATABRICKS]
      system_instructions: "Transforme eventos em pipelines reprodutíveis."
    doc:
      frameworks: [TOGAF, ADR]
      system_instructions: "Gere ADRs, runbooks e diagramas operacionais."

